<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="1000" height="480" fill="#e5e7eb"/>

  <!-- Dialog card -->
  <rect x="180" y="40" width="640" height="330" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="210" y="80" font-size="18" font-weight="700" fill="#111827">Key Ownership</text>
  <circle cx="778" cy="72" r="12" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="778" y="77" font-size="13" fill="#9ca3af" text-anchor="middle">✕</text>

  <text x="210" y="122" font-size="13" font-weight="600" fill="#374151">Owned By:</text>
  <circle cx="530" cy="118" r="6" fill="#2563eb"/>
  <circle cx="530" cy="118" r="2.5" fill="#ffffff"/>
  <text x="545" y="122" font-size="12" fill="#111827">You</text>
  <circle cx="600" cy="118" r="6" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="615" y="122" font-size="12" fill="#374151">Service Account</text>
  <circle cx="740" cy="118" r="6" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="755" y="122" font-size="12" fill="#374151">Agent</text>
  <rect x="787" y="112" width="30" height="14" rx="7" fill="#ede9fe"/>
  <text x="791" y="122" font-size="8" fill="#7c3aed">New</text>

  <text x="210" y="165" font-size="13" font-weight="600" fill="#374151">Organization:</text>
  <rect x="530" y="150" width="260" height="28" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="540" y="168" font-size="12" fill="#9ca3af">All Organizations</text>

  <text x="210" y="205" font-size="13" font-weight="600" fill="#374151">Team:</text>
  <rect x="530" y="190" width="260" height="28" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="540" y="208" font-size="12" fill="#9ca3af">Search or select a team</text>

  <rect x="210" y="234" width="580" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="224" y="254" font-size="11.5" fill="#1d4ed8">Please select a team to continue configuring your Virtual Key.</text>
  <text x="224" y="270" font-size="11.5" fill="#1d4ed8">If you do not see any teams, contact your Proxy Admin to add you to one.</text>

  <rect x="670" y="322" width="120" height="34" rx="6" fill="#e5e7eb"/>
  <text x="695" y="344" font-size="13" fill="#9ca3af">Create Key</text>

  <!-- Callouts -->
  <circle cx="516" cy="118" r="13" fill="#0021A5"/>
  <text x="516" y="123" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <circle cx="516" cy="204" r="13" fill="#0021A5"/>
  <text x="516" y="209" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <circle cx="656" cy="339" r="13" fill="#0021A5"/>
  <text x="656" y="344" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <!-- Legend -->
  <rect x="0" y="392" width="1000" height="88" fill="#f9fafb" stroke="#e5e7eb"/>
  <circle cx="30" cy="414" r="10" fill="#0021A5"/>
  <text x="30" y="418" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="50" y="418" font-size="12" fill="#111827">Owned By — leave on "You" for a personal or course-project key.</text>

  <circle cx="30" cy="438" r="10" fill="#0021A5"/>
  <text x="30" y="442" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="50" y="442" font-size="12" fill="#111827">Team — required. If none appear, ask your Proxy Admin (UF IT) to add you to one before you can create a key.</text>

  <circle cx="30" cy="462" r="10" fill="#0021A5"/>
  <text x="30" y="466" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="50" y="466" font-size="12" fill="#111827">Create Key — stays disabled until a team is selected. Copy the key value shown next — it's displayed only this once.</text>
</svg>
