site_name: AIBHS
docs_dir: docs
site_dir: /Users/saurabhext/Documents/my_projects/UF-AIBHS.github.io/_site
site_description: "AIBHS Master's Program \u2014 Artificial Intelligence in Biomedical\
  \ and Health Sciences, offered through the AI for Health Institute at the University\
  \ of Florida College of Medicine."
repo_url: https://github.com/UF-AIBHS/UF-AIBHS.github.io
edit_uri: edit/main/content/
copyright: Made with <a href="https://marimobook.org" target="_blank" rel="noopener"><svg
  viewBox="0 0 100 100" width="1em" height="1em" aria-hidden="true" style="vertical-align:-0.18em;margin-right:0.35em"><circle
  cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="7"></circle><path
  d="M30 35 L49 52 L49 67 Q39.5 67 30 59 Z" fill="currentColor"></path><path d="M70
  35 L51 52 L51 67 Q60.5 67 70 59 Z" fill="currentColor"></path></svg>Marimo-Book</a>
extra:
  generator: false
theme:
  name: material
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
    primary: custom
    accent: custom
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-night
      name: Switch to light mode
    primary: custom
    accent: custom
  features:
  - navigation.sections
  - navigation.expand
  - navigation.path
  - navigation.footer
  - navigation.instant
  - navigation.instant.prefetch
  - navigation.instant.progress
  - navigation.top
  - navigation.tracking
  - search.suggest
  - search.highlight
  - search.share
  - content.code.copy
  - content.code.annotate
  - toc.follow
  logo: images/aibhs-logo.png
extra_css:
- stylesheets/extra.css?v=0.1.30
extra_javascript:
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
- javascripts/mathjax.js?v=0.1.30
- path: javascripts/marimo_book.js?v=0.1.30
  defer: true
markdown_extensions:
- abbr
- admonition
- attr_list
- footnotes
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.arithmatex:
    generic: true
- pymdownx.betterem
- pymdownx.blocks.admonition
- pymdownx.blocks.caption
- pymdownx.blocks.details
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
- def_list
plugins:
- search
nav:
- Home: index.md
- About: about.md
- Staff: staff.md
- Software Index: resources.md
- Documents:
  - Faculty Handbook: documents/faculty-handbook.md
  - Orientation: documents/orientation.md
- Announcements: announcements.md
