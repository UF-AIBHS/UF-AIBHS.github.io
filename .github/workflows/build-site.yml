name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install marimo-book
        run: pip install marimo-book

      - name: Build site
        run: marimo-book build --strict

      - name: Default to light theme (ignore OS dark-mode preference)
        run: ./scripts/fix-theme-default.sh

      - name: Fix header branding (logo-only, no squish)
        run: ./scripts/fix-header-branding.sh

      - name: Fix theme CSS (font, spacing, dark-mode contrast, nav expand)
        run: ./scripts/fix-theme-css.sh

      - name: Fix nav double-click (indeterminate checkbox quirk)
        run: ./scripts/fix-nav-double-click.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
